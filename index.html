.page-enter{animation:v35PageIn .18s ease-out both}@keyframes v35PageIn{from{opacity:.55;transform:translateX(7px)}to{opacity:1;transform:none}}

.v43-date-action b{display:block}.v43-date-action small{color:var(--ios-sub,#6d6d75)}

</head>
<body><div class="v20-bottom-nav" id="v20BottomNav">
<button onclick="showWeddings()" data-nav="weddings"><span class="v20-icon">💍</span><span>Свадьбы</span></button>
<button onclick="showCalendar()" data-nav="calendar"><span class="v20-icon">📅</span><span>Календарь</span></button>
<button onclick="openCurrentOrNext()" data-nav="current"><span class="v20-icon">🎯</span><span>Текущая</span></button>
<button onclick="showClientBase()" data-nav="clients"><span class="v20-icon">👥</span><span>Клиенты</span></button>
<button onclick="showMoreMenu()" data-nav="more"><span class="v20-icon">•••</span><span>Ещё</span></button>
</div>
<div class="app">
<header><div class="v35-head-left"><button id="v35Back" class="v35-back" onclick="window.__v33SwipeBack&&window.__v33SwipeBack.goBack()" aria-label="Назад">‹</button><div><div class="muted">WEDDING PHOTOGRAPHER</div><h1 id="headerTitle">Мои свадьбы</h1></div></div><button class="primary v35-add" onclick="newWedding()">＋</button></header>
<main class="content" id="app"></main>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><div id="modalTitle" class="modal-title">Редактирование</div><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='wedding-photographer-v2';
const LEGACY_KEYS=["wedding-photographer-v1","wedding-photographer-v0"];
function loadDatabase(){
  let raw=localStorage.getItem(KEY), source=KEY;
  if(!raw){ for(const k of LEGACY_KEYS){ const candidate=localStorage.getItem(k); if(candidate){raw=candidate;source=k;break;} } }
  if(raw){ try{ const parsed=JSON.parse(raw); if(parsed && Array.isArray(parsed.weddings)) return {db:parsed,migrated:source!==KEY,source}; }catch(e){} }
  return {db:null,migrated:false,source:null};
}
const LOADED=loadDatabase();
const checklistTemplate={
 shooting:['Кадры деталей (кольца, платье, букет)','Сборы невесты','Сборы жениха','Портреты пары','Родители и близкие','Выход из дома / встреча','ЗАГС: вход','ЗАГС: церемония','ЗАГС: выход','Прогулка пары','Детали площадки','Гости и атмосфера','Первый танец','Тосты и реакции гостей','Торт','Финал вечера'],
 interviews:['Портрет жениха','Портрет невесты','Портрет родителей','Групповые фото с близкими','Общее фото пары'],
 montage:['Отобрать лучший материал','Отсортировать серии','Базовая цветокоррекция','Ретушь ключевых кадров','Обработка серий','Финальный просмотр','Экспорт фотографий','Экспорт превью','Передача клиенту','Резервная копия проекта']
};
let db=LOADED.db;
if(!db){
 db={selected:1,nextId:2,weddings:[makeWedding(1,'2026-09-26','Ставрополь','Алексей & Мария')],settings:{camera:'Canon EOS R6 Mark II',lenses:'RF 24-70mm F2.8 L IS USM; RF 70-200mm F2.8 L IS USM',gimbal:'DJI RS5 Combo',audio:'Hollyland / DJI Mic'}};
 save();
}
if(!Array.isArray(db.leads)) db.leads=[];

function makeWedding(id,date='2026-09-26',city='',names=''){
 const checks={};Object.keys(checklistTemplate).forEach(k=>checks[k]=checklistTemplate[k].map(x=>({text:x,done:false})));
 return {id,date,city,names,bookingStatus:'confirmed',price:'60000',deposit:'0',depositDate:'',contract:false,start:'12:00',end:'23:00',
  guests:'',hall:'',walkPlace:'',bridePrep:'',registry:'',
  paymentStatus:'partial',balanceDate:'',payments:[],
  route:{prepStart:'',prepEnd:'',registryStart:'',registryEnd:'',walkStart:'',walkEnd:'',banquetStart:'',banquetEnd:'',outdoorStart:'',outdoorEnd:''},ceremonyType:'zags',hasZags:true,hasOutdoor:false,outdoorCeremony:false,outdoorPlace:'',
  contacts:{customer:'',phone:'',telegram:'',groom:'',bride:'',groomPhone:'',bridePhone:'',notes:''},
  clientProfile:{source:'',anniversary:'',preferences:'',importantPeople:'',mustFilm:'',avoidFilm:'',music:'',notes:''},
  team:{host:'',photographer:'',decorator:'',organizer:'',specialEffects:'',makeup:'',other:''},
  equipment:{camera:'',lenses:'',flash:'',light:'',secondCamera:'',drone:false,secondPhotographer:false,notes:''},
  shotPlan:{details:false,prep:false,zags:false,walk:false,guests:false,banquet:false,dance:false,toasts:false,cake:false,finale:false},
  light:{groom:false,bride:false,host:false,recorder:false,mixer:false,backup:false,levels:false},
  post:{cards:false,backup1:false,backup2:false,sorted:false,proxies:false,rough:false,color:false,sound:false,export:false,delivered:false},
  deliverables:{preview:true,web:false,print:false,album:false,raw:false,delivered:false},
  reminders:[],
  events:[{id:1,time:'12:00',title:'Сборы невесты',place:'',note:'Детали · портреты'},
   {id:2,time:'14:00',title:'ЗАГС',place:'',note:'Вход · церемония · выход'},
   {id:3,time:'15:00',title:'Прогулка',place:'',note:'Пара · детали · гости'},
   {id:4,time:'17:00',title:'Ресторан',place:'',note:'Первый танец · тосты · эмоции'}],checks};
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function normalizeWedding(w){
 w.bookingStatus ??= (w.contract ? 'contract' : 'confirmed');
 if(!['confirmed','hold','contract'].includes(w.bookingStatus)) w.bookingStatus='confirmed';
 w.guests ??= ''; w.hall ??= ''; w.walkPlace ??= ''; w.bridePrep ??= ''; w.registry ??= '';
 w.paymentStatus ??= Number(w.deposit||0)>=Number(w.price||0)?'paid':Number(w.deposit||0)>0?'partial':'unpaid';
 w.balanceDate ??= ''; w.payments ??= [];
 w.route ??= {prepStart:'',prepEnd:'',registryStart:'',registryEnd:'',walkStart:'',walkEnd:'',banquetStart:'',banquetEnd:'',outdoorStart:'',outdoorEnd:''};
 w.route.prepStart ??= w.route.prepTime||''; w.route.prepEnd ??= '';
 w.route.registryStart ??= w.route.registryTime||''; w.route.registryEnd ??= '';
 w.route.walkStart ??= w.route.walkTime||''; w.route.walkEnd ??= '';
 w.route.banquetStart ??= w.route.banquetTime||''; w.route.banquetEnd ??= '';
 w.route.outdoorStart ??= ''; w.route.outdoorEnd ??= '';
 w.outdoorCeremony ??= false; w.outdoorPlace ??= '';
 w.ceremonyType ??= (w.outdoorCeremony ? 'outdoor' : (w.registry || w.route.registryStart || w.route.registryEnd ? 'zags' : 'none'));
 if(typeof w.hasZags !== 'boolean') w.hasZags = w.ceremonyType==='zags' || !!(w.registry || w.route.registryStart || w.route.registryEnd);
 if(typeof w.hasOutdoor !== 'boolean') w.hasOutdoor = w.ceremonyType==='outdoor' || !!w.outdoorCeremony;
 w.ceremonyType = w.hasZags && w.hasOutdoor ? 'both' : w.hasZags ? 'zags' : w.hasOutdoor ? 'outdoor' : 'none';
 w.outdoorCeremony = w.hasOutdoor;
 w.shotPlan ??= {details:false,prep:false,zags:false,walk:false,guests:false,banquet:false,dance:false,toasts:false,cake:false,finale:false};
 w.light ??= w.sound ?? {groom:false,bride:false,host:false,recorder:false,mixer:false,backup:false,levels:false}; delete w.sound;
 w.post ??= {cards:false,backup1:false,backup2:false,sorted:false,proxies:false,rough:false,color:false,sound:false,export:false,delivered:false};
 w.deliverables ??= {preview:true,web:false,print:false,album:false,raw:false,delivered:false};
 w.contractDate ??= ''; w.contractNumber ??= ''; w.contractNote ??= '';
 w.reminders ??= [];
 w.contacts ??= {customer:'',phone:'',telegram:'',groom:'',bride:'',groomPhone:'',bridePhone:'',notes:''};
 w.contacts.groom ??= ''; w.contacts.bride ??= ''; w.contacts.groomPhone ??= ''; w.contacts.bridePhone ??= ''; w.contacts.notes ??= '';
 w.clientProfile ??= {source:'',anniversary:'',preferences:'',importantPeople:'',mustFilm:'',avoidFilm:'',music:'',notes:''};
 w.team ??= {host:'',photographer:'',decorator:'',organizer:'',specialEffects:'',makeup:'',other:''};
 w.equipment ??= {camera:'',lenses:'',flash:'',light:'',secondCamera:'',drone:false,secondPhotographer:false,notes:''};
 w.events ??= []; w.checks ??= {};
 Object.keys(checklistTemplate).forEach(k=>w.checks[k] ??= checklistTemplate[k].map(x=>({text:x,done:false})));
 return w;
}
db.weddings.forEach(normalizeWedding);

function ensureOperational(w){
 w.weather ??= {condition:'',temp:'',note:''};
 w.journal ??= '';
 w.travel ??= {defaultMinutes:'',notes:''};
 w.wishes ??= {must:'',avoid:'',importantPeople:'',special:'',notes:''};
 w.guestGroups ??= '';
 w.events ??= [];
 syncRouteToEvents(w);
 return w;
}
function opCurrent(){return ensureOperational(current())}
function timeMinutes(t){if(!t)return null;const a=t.split(':').map(Number);return a[0]*60+a[1]}
function gapMinutes(a,b){const x=timeMinutes(a),y=timeMinutes(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d}
function nextEvent(w){const now=new Date();const today=w.date===now.toISOString().slice(0,10);const cur=now.getHours()*60+now.getMinutes();const list=[...w.events].sort((a,b)=>(a.time||'').localeCompare(b.time||''));return today?list.find(e=>timeMinutes(e.time)>=cur):list[0]}
function routeEvents(w){
 const r=w.route||{}, defs=[
 ['route-prep',r.prepStart,r.prepEnd,'Сборы невесты',w.bridePrep||'','Детали · портреты'],
 ...(w.hasZags ? [['route-registry',r.registryStart,r.registryEnd,'ЗАГС',w.registry||'','Вход · церемония · выход']] : []),
 ['route-walk',r.walkStart,r.walkEnd,'Прогулка',w.walkPlace||'','Пара · детали · гости'],
 ...(w.hasOutdoor ? [['route-outdoor',r.outdoorStart,r.outdoorEnd,'Выездная регистрация',w.outdoorPlace||'','Церемония']] : []),
 ['route-banquet',r.banquetStart,r.banquetEnd,'Банкет',w.hall||'','Первый танец · тосты · эмоции']
 ];
 return defs.filter(x=>x[1]).map(x=>({id:x[0],time:x[1],title:x[3],place:x[4],note:x[5],endTime:x[2],source:'route'}));
}
function syncRouteToEvents(w){
 const custom=(w.events||[]).filter(e=>e.source!=='route'&&!String(e.id).startsWith('route-'));
 w.events=[...routeEvents(w),...custom].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function syncEventsToRoute(w){
 const r=w.route||{}, by=Object.fromEntries((w.events||[]).map(e=>[String(e.id),e]));
 const map={'route-prep':['prepStart','prepEnd'],'route-registry':['registryStart','registryEnd'],'route-walk':['walkStart','walkEnd'],'route-outdoor':['outdoorStart','outdoorEnd'],'route-banquet':['banquetStart','banquetEnd']};
 Object.entries(map).forEach(([id,k])=>{if(by[id]){r[k[0]]=by[id].time||'';r[k[1]]=by[id].endTime||'';}});
 w.route=r;
}
function migrateDatabase(){
 db.weddings=(db.weddings||[]).map(w=>{
  normalizeWedding(w);ensureOperational(w);
  const legacyMap=[[/сбор/i,'route-prep','prepStart','prepEnd'],[/загс/i,'route-registry','registryStart','registryEnd'],[/прогул/i,'route-walk','walkStart','walkEnd'],[/выезд/i,'route-outdoor','outdoorStart','outdoorEnd'],[/ресторан|банкет/i,'route-banquet','banquetStart','banquetEnd']];
  for(const e of (w.events||[])){
   if(e.source==='route')continue;
   const hit=legacyMap.find(x=>x[0].test(e.title||''));
   if(hit && !w.route[hit[2]] && e.time){w.route[hit[2]]=e.time;w.route[hit[3]]=e.endTime||'';}
  }
  syncRouteToEvents(w);return w;
 });
 save();
}
migrateDatabase();
setTimeout(scheduleAllReminderNotifications,300);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleAllReminderNotifications()});
window.addEventListener('focus',()=>scheduleAllReminderNotifications());
if(LOADED.migrated){setTimeout(()=>alert('База предыдущей версии автоматически перенесена.'),300);}

function calendarStatus(w){
 const st=w.bookingStatus||'confirmed';
 if(w.archived)return 'archive';
 return st;
}
function bookingStatusLabel(st){return st==='hold'?'Предварительная бронь':st==='contract'?'Договор подписан':st==='archive'?'Архив':'Забронировано'}
function bookingStatusClass(st){return st==='hold'?'hold':st==='contract'?'contract':'booked'}
function monthTitle(y,m){return new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(y,m,1)).replace(/^./,c=>c.toUpperCase())}
function showCalendar(monthOffset=window.calendarMonthOffset||0){
 window.calendarMonthOffset=monthOffset;
 headerTitle.textContent='Забронированные даты';
 const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+monthOffset);
 const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
 const mondayIndex=(first.getDay()+6)%7;
 const booked=new Map();(db.weddings||[]).forEach(w=>{if(w.date&&!w.archived)booked.set(w.date,w)});
 const today=new Date();const todayKey=today.toISOString().slice(0,10);
 let cells='';
 for(let i=0;i<mondayIndex;i++)cells+='<div class="cal-day empty"></div>';
 for(let d=1;d<=days;d++){
   const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,w=booked.get(key),st=w?calendarStatus(w):'';
   cells+=`<div class="cal-day ${w?bookingStatusClass(st):''} ${key===todayKey?'today':''}" onclick="v43CalendarDate(\'${key}\')"><div class="num">${d}</div>${w?`<div class="dot">${st==='hold'?'🟡':st==='contract'?'🔵':'🔴'} ${esc(w.names||'Забронировано')}</div><div class="muted" style="font-size:10px">${esc(w.city||'')}</div>`:''}</div>`;
 }
 const list=[...(db.weddings||[])].filter(w=>!w.archived&&w.date&&w.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).sort((a,b)=>a.date.localeCompare(b.date));
 const eventList=[...(db.events||[])].filter(e=>e.date&&e.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).sort((a,b)=>a.date.localeCompare(b.date));
 app.innerHTML=`<h2>📅 Забронированные даты</h2>
 <div class="card calendar-card"><div class="calendar-head"><button class="secondary smallbtn" onclick="showCalendar(${monthOffset-1})">‹</button><b>${monthTitle(y,m)}</b><button class="secondary smallbtn" onclick="showCalendar(${monthOffset+1})">›</button></div>
 <div class="calendar-grid" style="margin-top:10px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
 <div class="calendar-legend"><span>🔴 Забронировано</span><span>🟡 Предварительная бронь</span><span>🔵 Договор подписан</span></div></div>
 <h3>${list.length?'Свадьбы в этом месяце':'Свободных/забронированных свадеб в этом месяце нет'}</h3>
 ${list.map(w=>`<div class="card booking-row" onclick="openWedding(${w.id})"><div class="booking-date">${formatDate(w.date).slice(0,5)}</div><div class="booking-main"><b>${esc(w.names||'Без названия')}</b><span class="muted">${esc(w.city||'')} · ${bookingStatusLabel(calendarStatus(w))} · ${money(w.price)}</span></div><div class="booking-actions"><button class="secondary smallbtn" onclick="event.stopPropagation();editWedding(${w.id})">✎</button></div></div>`).join('')}
 ${eventList.length?`<h3>События</h3>${eventList.map(e=>`<div class="card booking-row"><div class="booking-date">${formatDate(e.date).slice(0,5)}</div><div class="booking-main"><b>📌 ${esc(e.title)}</b><span class="muted">${esc(e.time||'Весь день')} · ${esc(e.place||'')} · ${esc(e.note||'')}</span></div></div>`).join('')}`:''}
 <div class="card"><div class="section-title"><b>Сводка</b><span class="badge">${list.length} дат</span></div><div class="muted" style="margin-top:8px">🔴 ${list.filter(w=>(w.bookingStatus||'confirmed')==='confirmed').length} забронировано · 🟡 ${list.filter(w=>w.bookingStatus==='hold').length} предбронь · 🔵 ${list.filter(w=>w.bookingStatus==='contract').length} договор</div></div>
 <button class="secondary" style="width:100%" onclick="showWeddings()">← Все свадьбы</button>`;
}
function showLogistics(){
 const w=opCurrent(), ev=[...w.events].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const gaps=ev.slice(0,-1).map((e,i)=>{const n=ev[i+1],g=gapMinutes(e.time,n.time);return {a:e,b:n,g}}).filter(x=>x.g!=null);
 const risky=gaps.filter(x=>x.g<30);
 app.innerHTML=`<h2>🚗 Логистика и переезды</h2>
 <div class="card"><div class="section-title"><b>Контроль времени</b><span class="badge ${risky.length?'warn':'ok'}">${risky.length?risky.length+' узких мест':'Критичных интервалов нет'}</span></div><label>Средний запас на переезд, мин</label><input type="number" min="0" value="${esc(w.travel.defaultMinutes)}" onchange="opCurrent().travel.defaultMinutes=this.value;save();showLogistics()"><label>Общие заметки</label><textarea onchange="opCurrent().travel.notes=this.value;save()">${esc(w.travel.notes)}</textarea></div>
 ${gaps.length?`<h3>Интервалы между событиями</h3>${gaps.map(x=>`<div class="card"><b>${esc(x.a.time)} ${esc(x.a.title)}</b><div class="muted">→ ${esc(x.b.time)} ${esc(x.b.title)}</div><div style="margin-top:8px"><span class="badge ${x.g<30?'warn':'ok'}">${x.g} мин</span>${x.a.place||x.b.place?`<span class="badge">${esc(x.a.place||'')} → ${esc(x.b.place||'')}</span>`:''}</div>${x.g<30?'<div class="notice">Мало времени на переезд/подготовку. Проверь маршрут и запас.</div>':''}</div>`).join('')}`:'<div class="empty">Добавь события в тайминг — здесь появится контроль переездов.</div>'}
 <button class="secondary" style="width:100%" onclick="showCurrent()">← Панель дня</button>`;
}
function showWishes(){
 const w=opCurrent();
 app.innerHTML=`<h2>❤️ Пожелания пары</h2><div class="card">
 <label>Обязательно снять / показать</label><textarea onchange="opCurrent().wishes.must=this.value;save()">${esc(w.wishes.must||w.clientProfile?.mustFilm||'')}</textarea>
 <label>Не снимать / избегать</label><textarea onchange="opCurrent().wishes.avoid=this.value;save()">${esc(w.wishes.avoid||w.clientProfile?.avoidFilm||'')}</textarea>
 <label>Важные люди</label><textarea onchange="opCurrent().wishes.importantPeople=this.value;save()">${esc(w.wishes.importantPeople||w.clientProfile?.importantPeople||'')}</textarea>

function reminderDateTime(r){return r.date+'T'+(r.time||'09:00')}
function reminderIsPast(r){return new Date(reminderDateTime(r)).getTime()<Date.now()}
function reminderLabel(r){
 const icons={payment:'💰',prep:'🎥',sound:'💡',timeline:'📋',backup:'💾',montage:'🎬',delivery:'📦',custom:'🔔'};
 return (icons[r.type]||'🔔')+' '+r.title;
}
function notificationSupported(){return 'Notification' in window}
function notificationPermissionLabel(){
 if(!notificationSupported()) return 'Недоступно в этом браузере';
 if(Notification.permission==='granted') return 'Уведомления включены';
 if(Notification.permission==='denied') return 'Уведомления запрещены в настройках iPhone';
 return 'Разрешить уведомления';
}
async function enableReminderNotifications(){
 if(!notificationSupported()){alert('Этот браузер не поддерживает системные уведомления. На iPhone открой приложение с экрана «Домой» (PWA) в Safari.');return;}
 try{
  const p=await Notification.requestPermission();
  if(p==='granted'){localStorage.setItem('wedding-photographer-notifications','1');scheduleAllReminderNotifications();showReminders();}
  else showReminders();
 }catch(e){alert('Не удалось запросить разрешение на уведомления. Открой приложение как PWA с экрана «Домой» и попробуй ещё раз.');}
}
const reminderTimers=new Map();
function clearReminderTimers(){for(const t of reminderTimers.values())clearTimeout(t);reminderTimers.clear();}
function fireReminderNotification(r,w){
 if(!notificationSupported() || Notification.permission!=='granted' || r.done) return;
 const key='wedding-photographer-notified-'+r.id;
 if(localStorage.getItem(key)) return;
 try{
  const title=r.title||'Напоминание';
  const body=[w?.names||'Свадьба',r.note||'',r.time||''].filter(Boolean).join(' · ');
  const n=new Notification('💍 '+title,{body,tag:'wedding-reminder-'+r.id,renotify:false});
  n.onclick=()=>{window.focus();try{showReminders()}catch(e){}};
  localStorage.setItem(key,String(Date.now()));
 }catch(e){}
}
function scheduleReminderNotification(r,w){
 if(!r || r.done || !r.date) return;
 const when=new Date(reminderDateTime(r)).getTime(), delay=when-Date.now();
 if(delay<=0){if(delay>-86400000)fireReminderNotification(r,w);return;}
 if(delay>2147483647)return;
 const old=reminderTimers.get(r.id);if(old)clearTimeout(old);
 reminderTimers.set(r.id,setTimeout(()=>{reminderTimers.delete(r.id);fireReminderNotification(r,w)},delay));
}
function scheduleAllReminderNotifications(){
 clearReminderTimers();
 if(!notificationSupported() || Notification.permission!=='granted')return;
 (db.weddings||[]).forEach(w=>(w.reminders||[]).forEach(r=>scheduleReminderNotification(r,w)));
}
function reminderNotificationBlock(){
 const state=notificationPermissionLabel();
 const cls=Notification&&Notification.permission==='granted'?'v37-status-ok':(Notification&&Notification.permission==='denied'?'v37-status-warn':'');
 return `<div class="v37-notify"><div><b>🔔 Уведомления iPhone</b><span class="${cls}">${esc(state)}</span></div><button class="secondary smallbtn" onclick="enableReminderNotifications()">${Notification&&Notification.permission==='granted'?'Проверить':'Включить'}</button></div>`;
}
function showReminders(){
 const w=current();
 const items=[...w.reminders].sort((a,b)=>reminderDateTime(a).localeCompare(reminderDateTime(b)));
 const active=items.filter(x=>!x.done);
 app.innerHTML=`<h2>Напоминания</h2>
 ${reminderNotificationBlock()}
 <div class="card hero">
  <div class="section-title"><b>Активные задачи</b><span class="badge">${active.length}</span></div>

function quickReminder(type){

function timelineHTML(limit=999){
 const w=current();if(!w.events.length)return '<div class="empty">Событий нет</div>';
 return '<div class="timeline">'+w.events.slice(0,limit).map(e=>`<div class="event"><div class="eventrow"><div><div class="time">${esc(e.time)} — ${esc(e.title)}</div><div class="muted">${esc(e.place||'')} ${e.place&&e.note?'· ':''}${esc(e.note||'')}</div></div><div class="eventactions"><button class="secondary" onclick="editEvent(${e.id})">✎</button><button class="secondary danger" onclick="deleteEvent(${e.id})">×</button></div></div></div>`).join('')+'</div>';
}

 <div class="formgrid"><div><label>ЗАГС — начало</label><input id="rRegistryStart" type="time" value="${esc(w.route.registryStart)}"></div><div><label>ЗАГС — конец</label><input id="rRegistryEnd" type="time" value="${esc(w.route.registryEnd)}"></div></div>
 <div class="formgrid"><div><label>Прогулка — начало</label><input id="rWalkStart" type="time" value="${esc(w.route.walkStart)}"></div><div><label>Прогулка — конец</label><input id="rWalkEnd" type="time" value="${esc(w.route.walkEnd)}"></div></div>
 <div class="formgrid"><div><label>Банкет — начало</label><input id="rBanquetStart" type="time" value="${esc(w.route.banquetStart)}"></div><div><label>Банкет — конец</label><input id="rBanquetEnd" type="time" value="${esc(w.route.banquetEnd)}"></div></div>
 <div class="formgrid"><div><label>Выездная — начало</label><input id="rOutdoorStart" type="time" value="${esc(w.route.outdoorStart)}"></div><div><label>Выездная — конец</label><input id="rOutdoorEnd" type="time" value="${esc(w.route.outdoorEnd)}"></div></div>
 <label>Дата предоплаты</label><input id="wDepositDate" type="date" value="${esc(w.depositDate)}"><div class="check"><input id="wContract" type="checkbox" ${w.contract?'checked':''}><label for="wContract">Договор подписан</label></div><label>Заказчик</label><input id="wCustomer" value="${esc(w.contacts.customer)}"><label>Телефон</label><input id="wPhone" value="${esc(w.contacts.phone)}"><label>Telegram</label><input id="wTelegram" value="${esc(w.contacts.telegram)}"><div class="actions"><button class="primary" onclick="saveWeddingForm(${id||0})">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`);
}
function newWedding(){editWedding(0)}
function saveWeddingForm(id){
 let w=db.weddings.find(x=>x.id===id);
 if(!w){w=makeWedding(db.nextId++,wDate.value,wCity.value.trim(),wNames.value.trim());db.weddings.push(w)}
 const duplicate=db.weddings.find(x=>x.id!==w.id && x.date===wDate.value && !x.archived); if(duplicate && !confirm('На эту дату уже есть свадьба: '+(duplicate.names||'без названия')+'. Всё равно сохранить?')) return; Object.assign(w,{date:wDate.value,bookingStatus:wBookingStatus.value,city:wCity.value.trim(),names:wNames.value.trim(),start:wStart.value,end:wEnd.value,price:wPrice.value,deposit:wDeposit.value,depositDate:wDepositDate.value,contract:wContract.checked,guests:wGuests.value,hall:wHall.value.trim(),walkPlace:wWalkPlace.value.trim(),bridePrep:wBridePrep.value.trim(),registry:wRegistry.value.trim()});
 w.hasZags=wHasZags.checked;w.hasOutdoor=wHasOutdoor.checked;w.ceremonyType=w.hasZags&&w.hasOutdoor?'both':w.hasZags?'zags':w.hasOutdoor?'outdoor':'none';w.outdoorCeremony=w.hasOutdoor;
 w.route={...w.route,prepStart:rPrepStart.value,prepEnd:rPrepEnd.value,registryStart:rRegistryStart.value,registryEnd:rRegistryEnd.value,walkStart:rWalkStart.value,walkEnd:rWalkEnd.value,banquetStart:rBanquetStart.value,banquetEnd:rBanquetEnd.value,outdoorStart:rOutdoorStart.value,outdoorEnd:rOutdoorEnd.value};w.outdoorPlace=wOutdoorPlace.value.trim();syncRouteToEvents(w);
 w.contacts={...w.contacts,customer:wCustomer.value.trim(),phone:wPhone.value.trim(),telegram:wTelegram.value.trim(),groomPhone:wGroomPhone.value.trim(),bridePhone:wBridePhone.value.trim()};
 db.selected=w.id;save();closeModal();showCurrent();
}
function deleteWedding(id){if(db.weddings.length===1)return alert('Нельзя удалить единственную свадьбу.');if(confirm('Удалить эту свадьбу?')){db.weddings=db.weddings.filter(w=>w.id!==id);if(db.selected===id)db.selected=db.weddings[0].id;save();showWeddings()}}
function showTeamLegacy(){
 const t=current().team;
 app.innerHTML=`<h2>Команда свадьбы</h2><div class="card">
 ${teamInput('host','🎤 Ведущий',t.host)}${teamInput('photographer','📷 Фотограф',t.photographer)}${teamInput('decorator','🌿 Оформители',t.decorator)}${teamInput('organizer','📋 Организатор',t.organizer)}${teamInput('specialEffects','✨ Спецэффекты',t.specialEffects)}${teamInput('makeup','💄 Визажисты',t.makeup)}${teamInput('other','👤 Другое',t.other)}
 </div><div class="notice">Все данные относятся к выбранной свадьбе.</div>`;
}
function teamInput(k,label,v){return `<label>${label}</label><input value="${esc(v)}" onchange="current().team['${k}']=this.value;save()">`}
function showEquipment(){
 const q=current().equipment;
 app.innerHTML=`<h2>Техника фотографа</h2><div class="card"><label>Камера</label><input value="${esc(q.camera)}" onchange="current().equipment.camera=this.value;save()"><label>Объективы</label><textarea onchange="current().equipment.lenses=this.value;save()">${esc(q.lenses)}</textarea><label>Вспышки</label><input value="${esc(q.flash)}" onchange="current().equipment.flash=this.value;save()"><label>Свет</label><input value="${esc(q.light)}" onchange="current().equipment.light=this.value;save()"><label>Вторая камера</label><input value="${esc(q.secondCamera)}" onchange="current().equipment.secondCamera=this.value;save()"><div class="check"><input type="checkbox" ${q.drone?'checked':''} onchange="current().equipment.drone=this.checked;save()"><label>Дрон</label></div><div class="check"><input type="checkbox" ${q.secondPhotographer?'checked':''} onchange="current().equipment.secondPhotographer=this.checked;save()"><label>Второй фотограф</label></div><label>Заметки</label><textarea onchange="current().equipment.notes=this.value;save()">${esc(q.notes)}</textarea></div>`;
}
function showSettings(){
 const hasLegacy=LEGACY_KEYS.some(k=>!!localStorage.getItem(k));
 app.innerHTML=`<h2>Настройки</h2><div class="card"><b>Общие настройки техники по умолчанию</b><label>Камера</label><input value="${esc(db.settings.camera)}" onchange="db.settings.camera=this.value;save()"><label>Объективы</label><textarea onchange="db.settings.lenses=this.value;save()">${esc(db.settings.lenses)}</textarea><label>Вспышки</label><input value="${esc(db.settings.flash||'')}" onchange="db.settings.flash=this.value;save()"><label>Свет</label><input value="${esc(db.settings.light||'')}" onchange="db.settings.light=this.value;save()"><label>Вторая камера</label><input value="${esc(db.settings.secondCamera||'')}" onchange="db.settings.secondCamera=this.value;save()"></div>
 <div class="card"><b>🔄 База данных</b><p class="muted">База предыдущей версии переносится автоматически, если она найдена.</p>${hasLegacy?'<div class="notice">Найдена база предыдущей версии.</div>':''}<button class="primary" style="width:100%;margin-top:8px" onclick="migrateFromLegacyNow()">🔄 Подтянуть базу предыдущей версии</button><button class="secondary" style="width:100%;margin-top:8px" onclick="exportDatabase()">⬇️ Экспортировать базу</button><label style="display:block;margin-top:10px">Импорт базы</label><input id="importFile" type="file" accept=".json,application/json" onchange="importDatabase(this.files[0])"></div>
 <div class="card"><b>Свадьбы</b><p class="muted">Можно создавать сколько угодно отдельных свадеб. Все данные каждой свадьбы хранятся отдельно.</p><button class="secondary" onclick="showWeddings()">Открыть список свадеб</button></div><div class="card"><button class="secondary danger" style="width:100%" onclick="resetAll()">Сбросить все данные приложения</button></div>`;
}
function migrateFromLegacyNow(){
 let found=null,src='';for(const k of LEGACY_KEYS){const raw=localStorage.getItem(k);if(raw){try{const d=JSON.parse(raw);if(d&&Array.isArray(d.weddings)){found=d;src=k;break;}}catch(e){}}}
 if(!found)return alert('База предыдущей версии не найдена.');db=found;db.weddings.forEach(w=>{normalizeWedding(w);ensureOperational(w);syncRouteToEvents(w)});save();alert('База перенесена из '+src+'.');showWeddings();
}
function exportDatabase(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wedding-database-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importDatabase(file){
 if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.weddings))throw 0;db=d;db.weddings.forEach(w=>{normalizeWedding(w);ensureOperational(w);syncRouteToEvents(w)});save();alert('База импортирована.');showWeddings();}catch(e){alert('Не удалось импортировать базу. Проверь файл резервной копии.')}};r.readAsText(file);
}
function resetAll(){if(confirm('Удалить все свадьбы и настройки?')){localStorage.removeItem(KEY);location.reload()}}
showWeddings();
</script>
<script id="v24-contact-functions">
function v24Phone(phone){let p=String(phone||'').trim().replace(/[^\d+]/g,'');if(/^8\d{10}$/.test(p))p='+7'+p.slice(1);return p}
function v24Digits(phone){return v24Phone(phone).replace(/\D/g,'')}
function v24Call(phone){const p=v24Phone(phone);if(p)location.href='tel:'+p}
function v24WA(phone){const p=v24Digits(phone);if(p)location.href='https://wa.me/'+p}
function v24TG(value){const raw=String(value||'').trim();if(!raw)return;const username=raw.replace(/^@/,'');if(/^[A-Za-z0-9_]{5,32}$/.test(username)&&!/^\+?\d/.test(username))location.href='https://t.me/'+username;else{const p=v24Digits(raw);if(p)location.href='tg://resolve?phone='+p}}
function v24Copy(phone,btn){const p=v24Phone(phone);if(!p)return;navigator.clipboard?.writeText(p).then(()=>{if(btn){let x=btn.innerHTML;btn.innerHTML='✓';setTimeout(()=>btn.innerHTML=x,1000)}})}
function v24Stop(e){if(e){e.preventDefault();e.stopPropagation()}}
function v24Actions(phone){if(!phone)return '';const q=String(phone).replace(/\\/g,'\\\\').replace(/'/g,"\\'");return `<div class="v24-contact-actions"><button class="secondary" onclick="v24Stop(event);v24Call('${q}')">📞</button><button class="secondary" onclick="v24Stop(event);v24WA('${q}')">💬</button><button class="secondary" onclick="v24Stop(event);v24TG('${q}')">✈️</button><button class="secondary" onclick="v24Stop(event);v24Copy('${q}',this)">📋</button></div>`}
function v24TelegramAction(value){if(!value)return '';const q=String(value).replace(/\\/g,'\\\\').replace(/'/g,"\\'");return `<button class="secondary" onclick="v24Stop(event);v24TG('${q}')">✈️ TG</button>`}
</script>

<script id="v33-ios-swipe-back">
(function(){
  // iOS-style edge swipe back. Keeps the existing app/database untouched.
  const SWIPE_EDGE = 42;
  const SWIPE_TRIGGER = 70;
  const SWIPE_VERTICAL_MAX = 55;
  let sx=0, sy=0, tracking=false, blocked=false;
  const navStack = [{name:'showWeddings', args:[]}];
  let replaying = false;

  function installHistoryWrappers(){
    const names = [
      'showWeddings','showCalendar','showWeddingGroup','showCurrent','showClientBase',
      'showIdeas','showStats','showReminders','showLeads','showBusiness','showMoreMenu',
      'showChecklists','showTasks','showSettings','showTeam','showEquipment','showContract',
      'showContacts','showLocations','showTimeline','showClientProfile','showMoney',
      'showLogistics','showWishes','showGuests','showFinance','showBackupControl',
      'showShootPlan','showSound','showPost','showShotList','showBusiness',
      'openWedding','editWedding'
    ];
    names.forEach(name=>{
      const fn=window[name];
      if(typeof fn!=='function' || fn.__v33Wrapped) return;
      function wrapped(){
        const args=Array.from(arguments);
        if(!replaying){
          const last=navStack[navStack.length-1];
          const same=last && last.name===name && JSON.stringify(last.args)===JSON.stringify(args);
          if(!same) navStack.push({name,args}); if(window.__v35UpdateBack) window.__v35UpdateBack();
          if(navStack.length>30) navStack.splice(1,navStack.length-30);
        }
        return fn.apply(this,args);
      }
      wrapped.__v33Wrapped=true;
      window[name]=wrapped;
    });
  }

  function goBack(){
    const modal=document.getElementById('modal');
    if(modal && modal.classList.contains('show')){
      if(typeof window.closeModal==='function') window.closeModal();
      return;
    }
    if(navStack.length<=1) return;
    navStack.pop(); if(window.__v35UpdateBack) window.__v35UpdateBack();
    const prev=navStack[navStack.length-1];
    const fn=window[prev.name];
    if(typeof fn!=='function') return;
    replaying=true;
    try{ fn.apply(window,prev.args||[]); } finally { replaying=false; }
  }

  function onStart(e){
    if(!e.touches || e.touches.length!==1) return;
    const t=e.touches[0];
    sx=t.clientX; sy=t.clientY;
    tracking=sx<=SWIPE_EDGE;
    blocked=!!e.target.closest('input,textarea,select,button,[contenteditable="true"]');
  }
  function onMove(e){
    if(!tracking || blocked || !e.touches || e.touches.length!==1) return;
    const t=e.touches[0], dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
    if(dx>12 && dy<SWIPE_VERTICAL_MAX && e.cancelable) e.preventDefault();
  }
  function onEnd(e){
    if(!tracking || blocked) {tracking=false; return;}
    const t=e.changedTouches && e.changedTouches[0];
    if(t){
      const dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
      if(dx>=SWIPE_TRIGGER && dy<=SWIPE_VERTICAL_MAX) goBack();
    }
    tracking=false;
  }

  installHistoryWrappers();
  window.addEventListener('touchstart',onStart,{passive:true});
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onEnd,{passive:true});
  window.__v33SwipeBack={goBack,navStack};
})();
</script>


<script id="v35-navigation-polish">
(function(){
  const appEl=document.getElementById('app');
  if(appEl){const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML'); if(d&&d.set&&!window.__v35InnerHTML){Object.defineProperty(appEl,'innerHTML',{configurable:true,get:d.get,set:function(v){d.set.call(this,v);this.classList.remove('page-enter');void this.offsetWidth;this.classList.add('page-enter');}});window.__v35InnerHTML=true;}}
  window.__v35UpdateBack=function(){const b=document.getElementById('v35Back');if(b&&window.__v33SwipeBack)b.classList.toggle('visible',window.__v33SwipeBack.navStack.length>1);};
  setTimeout(window.__v35UpdateBack,50);
})();
</script>

<script id="v43-calendar-actions">
(function(){
  db.events ||= [];
  function v43dateLabel(iso){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso+'T12:00:00'))}
  window.v43CalendarDate=function(date){
    const existing=(db.weddings||[]).filter(w=>w.date===date&&!w.archived);
    const events=(db.events||[]).filter(e=>e.date===date);
    openModal('Действие на дату',`
      <div class="v43-date-modal">
        <div class="v43-date-big">${v43dateLabel(date)}</div>
        <div class="v43-date-sub">${existing.length?`Свадьба: ${esc(existing.map(w=>w.names||'Без названия').join(', '))}`:'Дата свободна'}${events.length?` · Событий: ${events.length}`:''}</div>
        <button class="secondary v43-date-action" onclick="closeModal();newWeddingOnDate('${date}')">
          <span class="ico">💍</span><span><b>Создать свадьбу</b><small>Открыть карточку новой свадьбы</small></span>
        </button>
        <button class="secondary v43-date-action" onclick="closeModal();newEventOnDate('${date}')">
          <span class="ico">📌</span><span><b>Создать событие</b><small>Встреча, съёмка, созвон или другое дело</small></span>
        </button>
        ${existing.map(w=>`<button class="secondary v43-date-action" onclick="closeModal();openWedding(${w.id})"><span class="ico">📅</span><span><b>Открыть ${esc(w.names||'свадьбу')}</b><small>Перейти к карточке свадьбы</small></span></button>`).join('')}
        ${events.map(e=>`<div class="card" style="margin:8px 0"><b>📌 ${esc(e.title)}</b><div class="muted">${esc(e.time||'Весь день')} · ${esc(e.note||'')}</div></div>`).join('')}
      </div>`);
  };
  window.newWeddingOnDate=function(date){
    editWedding(0);
    setTimeout(()=>{const x=document.getElementById('wDate');if(x)x.value=date},20);
  };
  window.newEventOnDate=function(date){
    openModal('Новое событие',`
      <label>Название события</label><input id="v43EventTitle" placeholder="Например: встреча с клиентом">
      <div class="formgrid"><div><label>Начало</label><input id="v43EventTime" type="time" value="12:00"></div><div><label>Конец</label><input id="v43EventEnd" type="time"></div></div>
      <label>Место</label><input id="v43EventPlace" placeholder="Адрес / локация">
      <label>Комментарий</label><textarea id="v43EventNote" placeholder="Что нужно сделать"></textarea>
      <div class="actions"><button class="primary" onclick="saveCalendarEvent('${date}')">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`);
  };
  window.saveCalendarEvent=function(date){
    const title=(document.getElementById('v43EventTitle')?.value||'').trim();
    if(!title){alert('Введите название события');return}
    db.events ||= [];
    db.events.push({id:'evt_'+Date.now(),date,title,time:document.getElementById('v43EventTime')?.value||'',endTime:document.getElementById('v43EventEnd')?.value||'',place:document.getElementById('v43EventPlace')?.value||'',note:document.getElementById('v43EventNote')?.value||''});
    save();closeModal();showCalendar(window.calendarMonthOffset||0);
  };
})();
</script>

<script id="v43-offline-registration">
(function(){
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(function(reg){
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        reg.update();
      }).catch(function(){});
  });
})();
</script>

<style id="v43-offline-status">
#v43OfflineStatus{
 position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));
 transform:translateX(-50%);z-index:99999;
 padding:6px 11px;border-radius:999px;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;
 background:rgba(60,60,67,.88);color:#fff;backdrop-filter:blur(12px);
 opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#v43OfflineStatus.show{opacity:1}
</style>
<script id="v43-offline-status">
(function(){
  var el;
  function show(msg){
    if(!el){el=document.createElement('div');el.id='v43OfflineStatus';document.body.appendChild(el)}
    el.textContent=msg;el.classList.add('show');
    clearTimeout(window.__v43offlineTimer);
    window.__v43offlineTimer=setTimeout(function(){el.classList.remove('show')},1800);
  }
  window.addEventListener('offline',function(){show('Нет интернета — офлайн режим')});
  window.addEventListener('online',function(){show('Интернет восстановлен')});
})();
</script>
